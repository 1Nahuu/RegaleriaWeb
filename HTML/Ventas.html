<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalería París - Ventas</title>
    <link rel="stylesheet" href="css/styleVentas.css">
    <link rel="icon" href="icono/icono.png" type="image/x-icon">
</head>
<body>

<header>
    <h1>Regalería París</h1>
</header>

<a href="Principal.html" class="back-button">Volver</a>

<div class="ventas-form">
    <h2>Realizar Venta</h2>

    <!-- Buscar -->
    <label>Buscar por:</label>
    <select id="search-type">
        <option value="name">Nombre</option>
        <option value="id">ID</option>
        <option value="price">Precio</option>
    </select>

    <input type="text" id="search" placeholder="Buscar producto...">



    <!-- Botón agregar -->
    <button id="add-button" class="add-product-button" >Agregar Producto al Carrito</button>

    <!-- Carrito -->
	<label>
    <h3 align="center">Carrito</h3>
        <div class='product-table'>
    <table id="carrito-table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>ID</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody id="carrito-body"></tbody>
    </table>
        </div>
	</label>
    <!-- Total -->
    <h2>Total: $<span id="total">0.00</span></h2>

    <!-- Realizar venta -->
    <div class="button-container">
        <button id="realizarVenta" class="add-product-button">Realizar Venta</button>
    </div>
</div>


<!-- ========================================= -->
<!--                JAVASCRIPT                 -->
<!-- ========================================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const API = "http://localhost:8080/productos";

    const searchInput = document.getElementById("search");
    const searchType = document.getElementById("search-type");
    const productList = document.getElementById("product-list");
    const addButton = document.getElementById("add-button");
    const carritoBody = document.getElementById("carrito-body");
    const totalSpan = document.getElementById("total");
    const realizarVentaBtn = document.getElementById("realizarVenta");

    let productos = [];
    let seleccionado = null;
    let carrito = [];

    // ---- Cargar todos ----
    async function cargarProductos() {
        const r = await fetch(API);
        productos = await r.json();
    }

    


    // ✅ Buscar cuando toco "Agregar al carrito"
    addButton.addEventListener("click", () => {
        const texto = searchInput.value.trim().toLowerCase();
        const tipo = searchType.value;

        if (texto === "") {
            alert("Escribí algo para buscar.");
            return;
        }

        // Buscar el producto según lo elegido
        const encontrados = productos.filter(p =>
            p[tipo]?.toString().toLowerCase().includes(texto)
        );

        if (encontrados.length === 0) {
            alert("No se encontró ningún producto.");
            return;
        }

        if (encontrados.length > 1) {
            alert("Se encontraron varios productos. Especifica mejor.");
            return;
        }

        // Solo uno encontrado → lo seleccionamos
        const producto = encontrados[0];

        const cantidad = parseInt(prompt("Cantidad:", "1"));
        if (isNaN(cantidad) || cantidad <= 0) {
            alert("Cantidad inválida.");
            return;
        }

        carrito.push({
            id: producto.id,
            name: producto.name,
            price: producto.price,
            cantidad
        });

        renderCarrito();
    });

    // ---- Render carrito ----
    function renderCarrito() {
        carritoBody.innerHTML = "";
        let total = 0;

        carrito.forEach(item => {
            const subtotal = item.price * item.cantidad;
            total += subtotal;

            carritoBody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.id}</td>
                    <td>$${item.price}</td>
                    <td>${item.cantidad}</td>
                    <td>$${subtotal.toFixed(2)}</td>
                </tr>
            `;
        });

        totalSpan.textContent = total.toFixed(2);
    }

    // ---- Realizar venta ----
    realizarVentaBtn.addEventListener("click", async () => {
        if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
        }
    try {

    for (const item of carrito) {

        const url = `${API}/${item.id}/stock/${item.cantidad}`;

        const response = await fetch(url, {
            method: "PUT"
        });

        if (!response.ok) {

            const errorText = await response.text();

            alert("Error: " + errorText);

            return;
        }
    }

    alert("Venta realizada correctamente.");

    carrito = [];
    renderCarrito();

} catch (error) {

    console.error("Error:", error);
}
    });





    cargarProductos();
});


</script>
